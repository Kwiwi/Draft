name: Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Build web assets (offline local target)
        run: npm run build:local

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Generate launcher icons
        run: npx capacitor-assets generate --android --assetPath resources

      # Unique versionCode helps installers treat this as a newer package.
      - name: Stamp CI versionCode / versionName
        run: |
          GRADLE="android/app/build.gradle"
          test -f "$GRADLE"
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE" | head -5

      # Fixed debug keystore → install over previous CI builds without uninstall.
      - name: Install stable debug keystore
        env:
          DRAFT_DEBUG_KEYSTORE_BASE64: ${{ secrets.DRAFT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${DRAFT_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing secret DRAFT_DEBUG_KEYSTORE_BASE64. Run ./scripts/generate-debug-keystore.sh and add GitHub Actions secrets (see README)."
            exit 1
          fi
          echo "$DRAFT_DEBUG_KEYSTORE_BASE64" | base64 -d > android/app/ci-debug.keystore
          test -s android/app/ci-debug.keystore
          cp scripts/ci-debug-signing.gradle android/app/ci-debug-signing.gradle
          # Apply after android {} block is defined in Cap-generated build.gradle
          if ! grep -q "ci-debug-signing.gradle" android/app/build.gradle; then
            printf '\napply from: "ci-debug-signing.gradle"\n' >> android/app/build.gradle
          fi
          echo "Signing snippet attached."

      - name: Build debug APK
        working-directory: android
        env:
          DRAFT_DEBUG_KEYSTORE_PATH: ci-debug.keystore
          DRAFT_DEBUG_STORE_PASSWORD: ${{ secrets.DRAFT_DEBUG_STORE_PASSWORD }}
          DRAFT_DEBUG_KEY_ALIAS: ${{ secrets.DRAFT_DEBUG_KEY_ALIAS }}
          DRAFT_DEBUG_KEY_PASSWORD: ${{ secrets.DRAFT_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Unique filename avoids phone download managers blocking "same APK already downloaded".
      - name: Package named APK
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          OUT="Draft-debug-r${{ github.run_number }}-${SHORT_SHA}.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${OUT}"
          ls -la dist/
          echo "APK_NAME=${OUT}" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: draft-debug-apk-r${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      # Public download target for site link: https://github.com/Kwiwi/Draft/releases/latest
      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-latest"
          TITLE="Draft debug (latest)"
          NOTES="Sideload debug APK from CI run ${{ github.run_number }} (${GITHUB_SHA:0:7}). Same stable debug signature — install over previous debug builds. Not for Play Store."
          # Keep a single moving "latest" debug tag for the site download link.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/*.apk \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
