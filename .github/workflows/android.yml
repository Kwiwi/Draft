name: Android APKs

# One source tree → three sideload APKs, each with its own package id and its
# own rolling release:
#   Draft              (com.kwiwi.draft)            offline build, all fonts local
#   Draft CDN          (com.kwiwi.draft.cdn)        light build, fonts via CDN
#   Draft CDN Local    (com.kwiwi.draft.cdnlocal)   light build, Latin fonts local
#
# The Capacitor edition comes from DRAFT_EDITION (see capacitor.config.js):
# no --config flag exists in Cap 7, it only reads the root config.
#
# Note: only the `offline` variant keeps the historic apk filename/artifact
# (Draft-debug-rN-sha / draft-debug-apk-rN) so existing download links keep working.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      editions:
        description: 'Editions to build: all | offline | cdn | cdn-local'
        default: 'all'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # capacitor.config.js picks this edition's JSON (Cap 7 has no --config).
      DRAFT_EDITION: ${{ matrix.edition }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: offline
            build: build:local
            apk_prefix: Draft
            release_tag: debug-latest
            release_title: Draft debug (latest)
            slug: com.kwiwi.draft
          - edition: cdn
            build: build:cdn
            apk_prefix: Draft-CDN
            release_tag: cdn-debug-latest
            release_title: Draft CDN debug (latest)
            slug: com.kwiwi.draft.cdn
          - edition: cdn-local
            build: build:cdn-local
            apk_prefix: Draft-CDN-Local
            release_tag: cdn-local-debug-latest
            release_title: Draft CDN Local debug (latest)
            slug: com.kwiwi.draft.cdnlocal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check edition selection
        id: want
        shell: bash
        env:
          SELECTION: ${{ github.event.inputs.editions || 'all' }}
        run: |
          if [[ "$SELECTION" == "all" || "$SELECTION" == "${{ matrix.edition }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.want.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        if: steps.want.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        if: steps.want.outputs.run == 'true'
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        if: steps.want.outputs.run == 'true'
        run: npm install

      - name: Build web assets (${{ matrix.edition }})
        if: steps.want.outputs.run == 'true'
        run: npm run ${{ matrix.build }}

      # The Capacitor CLI (7.x) has no --config flag; capacitor.config.js picks
      # the edition's JSON from DRAFT_EDITION (job env above).
      - name: Add Capacitor Android platform
        if: steps.want.outputs.run == 'true'
        run: |
          npx cap config --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("edition:",process.env.DRAFT_EDITION,"| id:",j.app.appId,"| webDir:",j.app.webDir)})'
          npx cap add android

      # Custom native plugins (PrintPlugin for PDF export) live outside the
      # generated android/ project; install them once it exists.
      - name: Install native plugins
        if: steps.want.outputs.run == 'true'
        env:
          DRAFT_ANDROID_DIR: android
          DRAFT_APP_ID: ${{ matrix.slug }}
        run: |
          if [ "${{ matrix.edition }}" = "offline" ]; then
            DEST="android/app/src/main/java/$(echo "${{ matrix.slug }}" | tr . /)"
            mkdir -p "$DEST"
            cp android-plugin/PrintPlugin.kt "$DEST/"
            ls -l "$DEST"
          else
            echo "No native plugins for the ${{ matrix.edition }} edition."
          fi

      - name: Sync web assets into Android project
        if: steps.want.outputs.run == 'true'
        run: npx cap sync android

      - name: Generate launcher icons
        if: steps.want.outputs.run == 'true'
        run: npx capacitor-assets generate --android --assetPath resources

      # Unique versionCode helps installers treat this as a newer package.
      - name: Stamp CI versionCode / versionName
        if: steps.want.outputs.run == 'true'
        run: |
          GRADLE="android/app/build.gradle"
          test -f "$GRADLE"
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$GRADLE"
          grep -E "versionCode|versionName|applicationId" "$GRADLE" | head -5

      # Fixed debug keystore → install over previous CI builds without uninstall.
      # The same key signs all editions; Android keeps them apart by package id.
      - name: Install stable debug keystore
        if: steps.want.outputs.run == 'true'
        env:
          DRAFT_DEBUG_KEYSTORE_BASE64: ${{ secrets.DRAFT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${DRAFT_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing secret DRAFT_DEBUG_KEYSTORE_BASE64. Run ./scripts/generate-debug-keystore.sh and add GitHub Actions secrets (see README)."
            exit 1
          fi
          echo "$DRAFT_DEBUG_KEYSTORE_BASE64" | base64 -d > android/app/ci-debug.keystore
          test -s android/app/ci-debug.keystore
          cp scripts/ci-debug-signing.gradle android/app/ci-debug-signing.gradle
          # Apply after android {} block is defined in Cap-generated build.gradle
          if ! grep -q "ci-debug-signing.gradle" android/app/build.gradle; then
            printf '\napply from: "ci-debug-signing.gradle"\n' >> android/app/build.gradle
          fi
          echo "Signing snippet attached."

      - name: Build debug APK
        if: steps.want.outputs.run == 'true'
        working-directory: android
        env:
          DRAFT_DEBUG_KEYSTORE_PATH: ci-debug.keystore
          DRAFT_DEBUG_STORE_PASSWORD: ${{ secrets.DRAFT_DEBUG_STORE_PASSWORD }}
          DRAFT_DEBUG_KEY_ALIAS: ${{ secrets.DRAFT_DEBUG_KEY_ALIAS }}
          DRAFT_DEBUG_KEY_PASSWORD: ${{ secrets.DRAFT_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Unique filename avoids phone download managers blocking "same APK already downloaded".
      # Offline keeps the historic name so old links still resolve.
      - name: Package named APK
        if: steps.want.outputs.run == 'true'
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN="${{ github.run_number }}"
          if [[ "${{ matrix.edition }}" == "offline" ]]; then
            OUT="Draft-debug-r${RUN}-${SHORT_SHA}.apk"
          else
            OUT="${{ matrix.apk_prefix }}-debug-r${RUN}-${SHORT_SHA}.apk"
          fi
          mkdir -p "dist/${{ matrix.edition }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${{ matrix.edition }}/${OUT}"
          ls -la "dist/${{ matrix.edition }}/"
          echo "APK_NAME=${OUT}" >> "$GITHUB_ENV"

      - name: Upload APK
        if: steps.want.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: draft-debug-apk-${{ matrix.edition }}-r${{ github.run_number }}
          path: dist/${{ matrix.edition }}/*.apk
          if-no-files-found: error

      # Public download target for site links:
      # https://github.com/Kwiwi/Draft/releases/latest               (offline)
      # https://github.com/Kwiwi/Draft/releases/tag/cdn-debug-latest (CDN)
      # https://github.com/Kwiwi/Draft/releases/tag/cdn-local-debug-latest
      - name: Publish rolling debug release
        if: steps.want.outputs.run == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ matrix.release_tag }}"
          TITLE="${{ matrix.release_title }}"
          NOTES="${{ matrix.edition }} debug APK from CI run ${{ github.run_number }} (${GITHUB_SHA:0:7}). Package: ${{ matrix.slug }}. Same stable debug signature — installs over previous debug builds of the same edition. Not for Play Store."
          # Keep a single moving "latest" debug tag per edition.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          LATEST_FLAG=""
          if [[ "${{ matrix.edition }}" == "offline" ]]; then LATEST_FLAG="--latest"; fi
          gh release create "$TAG" dist/${{ matrix.edition }}/*.apk \
            --title "$TITLE" \
            --notes "$NOTES" \
            $LATEST_FLAG
