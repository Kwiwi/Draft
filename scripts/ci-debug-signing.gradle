// Applied by CI after `npx cap add android` so every debug APK shares one signature.
// Variable names must not shadow Android DSL setters (keyAlias, storePassword, …).
def ciStorePath = System.getenv("DRAFT_DEBUG_KEYSTORE_PATH") ?: "ci-debug.keystore"
def ciStorePassword = System.getenv("DRAFT_DEBUG_STORE_PASSWORD")
def ciKeyAlias = System.getenv("DRAFT_DEBUG_KEY_ALIAS")
def ciKeyPassword = System.getenv("DRAFT_DEBUG_KEY_PASSWORD")

if (!ciStorePassword || !ciKeyAlias || !ciKeyPassword) {
    throw new GradleException(
        "Missing DRAFT_DEBUG_* signing env. Set GitHub Actions secrets " +
        "(see scripts/generate-debug-keystore.sh)."
    )
}

def ciKeystoreFile = file(ciStorePath)
if (!ciKeystoreFile.exists()) {
    throw new GradleException("Keystore file not found: ${ciKeystoreFile.absolutePath}")
}

android {
    signingConfigs {
        ciDebug {
            storeFile ciKeystoreFile
            storePassword ciStorePassword
            keyAlias ciKeyAlias
            keyPassword ciKeyPassword
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.ciDebug
        }
    }
}
